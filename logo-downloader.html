<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEKODE | High-Resolution Logo Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #043364;
            --accent-blue: #3576C1;
            --brand-yellow: #FEB611;
            --bg-dark: #020617;
            --card-bg: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .preview-container {
            width: 100%;
            height: 300px;
            background-color: var(--brand-blue);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .preview-container.checkerboard {
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #0f172a;
        }

        #logo-svg {
            width: 80%;
            height: auto;
            max-width: 500px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-opt {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-opt:hover {
            background: rgba(255,255,255,0.1);
        }

        .btn-opt.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .actions {
            display: flex;
            gap: 15px;
        }

        .btn-main {
            flex: 1;
            padding: 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-png {
            background: white;
            color: black;
        }

        .btn-png:hover {
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .btn-svg {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-svg:hover {
            background: rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DEKODE</h1>
            <p class="subtitle">High-Resolution Brand Assets Exporter</p>
        </header>

        <div class="card">
            <div id="preview" class="preview-container">
                <svg id="logo-svg" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
                    <text id="logo-text" x="50%" y="65%" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="90" font-weight="800" letter-spacing="4" fill="#FFFFFF">DEKODE</text>
                </svg>
            </div>

            <div class="controls">
                <div>
                    <label>Background</label>
                    <div class="btn-group">
                        <button class="btn-opt active" onclick="setBg('brand', this)">Brand Blue</button>
                        <button class="btn-opt" onclick="setBg('dark', this)">Dark</button>
                        <button class="btn-opt" onclick="setBg('transparent', this)">Transparent</button>
                    </div>
                </div>
                <div>
                    <label>Logo Color</label>
                    <div class="btn-group">
                        <button class="btn-opt active" onclick="setColor('#FFFFFF', this)">White</button>
                        <button class="btn-opt" onclick="setColor('#043364', this)">Dark Blue</button>
                        <button class="btn-opt" onclick="setColor('#FEB611', this)">Yellow</button>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-main btn-png" onclick="downloadPNG()">Download High-Res PNG (5000px)</button>
                <button class="btn-main btn-svg" onclick="downloadSVG()">Download SVG Vector</button>
            </div>
        </div>
    </div>

    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        const preview = document.getElementById('preview');
        const logoText = document.getElementById('logo-text');
        const logoSvg = document.getElementById('logo-svg');

        function setBg(type, btn) {
            document.querySelectorAll('.btn-group')[0].querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            preview.classList.remove('checkerboard');
            if (type === 'brand') preview.style.backgroundColor = '#043364';
            if (type === 'dark') preview.style.backgroundColor = '#020617';
            if (type === 'transparent') {
                preview.style.backgroundColor = 'transparent';
                preview.classList.add('checkerboard');
            }
        }

        function setColor(color, btn) {
            document.querySelectorAll('.btn-group')[1].querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            logoText.setAttribute('fill', color);
        }

        function downloadSVG() {
            const svgData = new XMLSerializer().serializeToString(logoSvg);
            const blob = new Blob([svgData], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'DEKODE_Logo.svg';
            a.click();
        }

        function downloadPNG() {
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            
            // 5000px width for extreme high resolution
            const targetWidth = 5000;
            const targetHeight = (targetWidth * 120) / 500;
            canvas.width = targetWidth;
            canvas.height = targetHeight;

            const svgData = new XMLSerializer().serializeToString(logoSvg);
            const img = new Image();
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // If not transparent, fill background
                if (!preview.classList.contains('checkerboard')) {
                    ctx.fillStyle = window.getComputedStyle(preview).backgroundColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                const pngUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = 'DEKODE_Logo_HighRes.png';
                a.click();
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    </script>
</body>
</html>
